# Reference CI of ostrom-web and ostrom-app (docs/CONVENTIONS.md sections 11 and 13). npm as in ostrom-app; ostrom-web
# uses pnpm: see the package manager rule of section 11.
name: Build
on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read # @ostrom-hq/core, the generated contract types
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm repository (ostrom-web): uncomment this step, set `cache: pnpm` below, and replace `npm ci` by
      # `pnpm install --frozen-lockfile` and `npm run` by `pnpm run`. With no `version` input, the action installs the
      # pnpm version of package.json's `packageManager` field, which the repository must set.
      # - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@ostrom-hq'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - run: npm run lint
      # Coverage thresholds (100 % lines, branches, functions, statements) live in the test config: below them, this fails.
      - run: npm run test -- --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
  # e2e:  Playwright (web) against the real server image and PostgreSQL, or Maestro on an Android emulator (app):
  #       added by each repository, required on every pull request (BRIEF, rule TESTS).
