# Reference CI of an Ostrom Kotlin repository (docs/CONVENTIONS.md section 11), after teamcode/.github/workflows/build.yml.
# Pull requests: one job, `ci` (the required check), Linux only, skipped on drafts.
# macOS, Windows and linuxArm64: main, version tags and workflow_dispatch only, never on a pull request.
name: Build
on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      full_validation:
        description: 'Run every native target (paid macOS and Windows runners)'
        type: boolean
        default: false
env:
  # A tag is the version (no "v" prefix); everything else builds a snapshot.
  ORG_GRADLE_PROJECT_ostromVersion: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0-SNAPSHOT' }}
  KOTLIN_VERSION: '2.4.21'
permissions:
  contents: read
  packages: read # run.ostrom artifacts of ostrom-core on GitHub Packages
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  ci:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ostrom
          POSTGRES_PASSWORD: ostrom
          POSTGRES_DB: ostrom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ostrom" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OSTROM_TEST_DATABASE_URL: postgresql://ostrom:ostrom@localhost:5432/ostrom_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      # The Kotlin/Native toolchain and its dependencies (~1 GB) are not in the Gradle cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ env.KOTLIN_VERSION }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-${{ env.KOTLIN_VERSION }}-
      - name: Install native link dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Never serve a test task from the cache
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/always-run-tests.init.gradle.kts <<'KTS'
          allprojects {
              tasks.withType<AbstractTestTask>().configureEach {
                  outputs.cacheIf { false }
                  outputs.upToDateWhen { false }
              }
          }
          KTS
      - run: python3 scripts/check-conventions.py
      # A repository that ships an executable (cli, server app) adds its link task, e.g. :cli:linkReleaseExecutableLinuxX64,
      # then its end-to-end and load tests against that binary.
      - run: ./gradlew detekt jvmTest koverVerify koverXmlReport linuxX64Test --continue
        # settings.gradle.kts reads GITHUB_ACTOR (set by Actions) and GITHUB_TOKEN to resolve ostrom-core.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports
          path: '**/build/reports/**'
          retention-days: 7
  cross-arm64:
    if: github.event_name != 'pull_request'
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ env.KOTLIN_VERSION }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-${{ env.KOTLIN_VERSION }}-
      # Kotlin/Native cross-compiles linuxArm64 from Linux x64; the test executable runs on an arm64 runner below.
      - run: ./gradlew linkDebugTestLinuxArm64
        # settings.gradle.kts reads GITHUB_ACTOR (set by Actions) and GITHUB_TOKEN to resolve ostrom-core.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-arm64
          path: '**/build/bin/linuxArm64/**'
          retention-days: 1
  run-arm64:
    needs: cross-arm64
    timeout-minutes: 20
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-arm64
      - name: Run every arm64 test executable
        run: |
          test "$(uname -m)" = aarch64
          find . -path '*linuxArm64/debugTest/test.kexe' -print0 | while IFS= read -r -d '' t; do chmod 755 "$t"; "$t"; done
  native:
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: MacosArm64
          - os: windows-latest
            target: MingwX64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ env.KOTLIN_VERSION }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-${{ env.KOTLIN_VERSION }}-
      - run: ./gradlew "${{ matrix.target == 'MacosArm64' && 'macosArm64Test' || 'mingwX64Test' }}"
        # settings.gradle.kts reads GITHUB_ACTOR (set by Actions) and GITHUB_TOKEN to resolve ostrom-core.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
