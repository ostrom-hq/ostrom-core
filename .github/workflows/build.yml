name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_validation:
        description: 'Also run the tests on macOS (macosArm64) and Windows (mingwX64) runners'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # one group per commit on main, so a quick series of merges never drops a publication
  group: build-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  native:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      # linuxX64 tests run here; linuxArm64 and mingwX64 tests and the macosArm64 klibs are cross-compiled.
      - run: ./gradlew --no-daemon linuxX64Test compileTestKotlinLinuxArm64 compileTestKotlinMingwX64 compileKotlinMacosArm64
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 3
  coverage:
    # jvmTest + koverVerify: 100 % of lines and branches of commonMain for every module with the test-only jvm() target.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - run: ./gradlew --no-daemon --no-build-cache jvmTest koverXmlReport koverLog
      - name: Uncovered lines and branches
        if: always()
        run: python3 .github/scripts/kover_missed.py
      - run: ./gradlew --no-daemon --no-build-cache koverVerify
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            **/build/reports/kover/
            **/build/reports/tests/
          retention-days: 7
  contract:
    # api/openapi.yaml is the contract: its TypeScript types must generate, and api/contract/shapes.json (read by the
    # Kotlin ContractTest) must be the one derived from it.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-types
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api-types/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run contract
      - name: api/contract/shapes.json is up to date with api/openapi.yaml
        run: git diff --exit-code -- ../api/contract/shapes.json
      - run: npm run build
  other-hosts:
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            task: macosArm64Test
          - runner: windows-latest
            task: mingwX64Test
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - run: ./gradlew --no-daemon ${{ matrix.task }}
        shell: bash
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native, contract]
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Publish dev.ostrom:ostrom-* 0.1.<run> to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_ostromCoreVersion: 0.1.${{ github.run_number }}
        run: ./gradlew --no-daemon publishAllPublicationsToGitHubPackagesRepository
      - run: echo "Published dev.ostrom:ostrom-api and dev.ostrom:ostrom-receipts 0.1.${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@ostrom-hq'
      - name: Publish @ostrom-hq/api-types 0.1.<run> to GitHub Packages
        working-directory: api-types
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm version --no-git-tag-version "0.1.${{ github.run_number }}"
          npm publish
      - run: echo "Published @ostrom-hq/api-types 0.1.${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
