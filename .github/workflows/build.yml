name: Build
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      full_validation:
        description: 'Also run the tests on macOS (macosArm64) and Windows (mingwX64) runners'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # one group per commit on main, so a quick series of merges never drops a publication
  group: build-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # The required check of a pull request (docs/CONVENTIONS.md section 11): Linux only, skipped on drafts.
  ci:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # @ostrom-hq/openapi, the server's generated document, from GitHub Packages.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      # The Kotlin/Native toolchain and its dependencies (~1 GB) are not in the Gradle cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-2.4.21-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-2.4.21-
      - name: Never serve a test task from the cache
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/always-run-tests.init.gradle.kts <<'KTS'
          allprojects {
              tasks.withType<AbstractTestTask>().configureEach {
                  outputs.cacheIf { false }
                  outputs.upToDateWhen { false }
              }
          }
          KTS
      - run: python3 scripts/check-conventions.py
      # The OpenAPI document the server generates, at the @ostrom-hq/openapi version client/openapi.version pins:
      # client's ContractTest compares every client call and every model with it, and fails without it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@ostrom-hq'
      - name: The server's OpenAPI document (@ostrom-hq/openapi)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir="$RUNNER_TEMP/openapi"
          mkdir -p "$dir"
          version="$(tr -d '[:space:]' < client/openapi.version)"
          (cd "$dir" && npm pack --silent "@ostrom-hq/openapi@$version" && tar -xzf "ostrom-hq-openapi-$version.tgz")
          test -s "$dir/package/openapi.json"
          echo "OSTROM_OPENAPI_DOCUMENT=$dir/package/openapi.json" >> "$GITHUB_ENV"
          echo "OSTROM_OPENAPI_REQUIRED=true" >> "$GITHUB_ENV"
          echo "- Contract: @ostrom-hq/openapi $version" >> "$GITHUB_STEP_SUMMARY"
      # detekt, the jvm() test run with Kover at 100 % of commonMain, the linuxX64 tests; linuxArm64 and mingwX64 tests
      # and the macosArm64 and iOS klibs are cross-compiled. The Android SDK variables are unset: these tasks must
      # configure and run without an SDK, as in the CI of ostrom-server and ostrom-cli, which include this build.
      - run: >-
          env -u ANDROID_HOME -u ANDROID_SDK_ROOT
          ./gradlew --no-daemon --continue detekt jvmTest koverVerifyCoverage koverXmlReportCoverage linuxX64Test
          compileTestKotlinLinuxArm64 compileTestKotlinMingwX64 compileKotlinMacosArm64
          compileKotlinIosArm64 compileKotlinIosSimulatorArm64
      # The Android target of api and client (build-logic ostrom.mobile): commonTest on the host JVM, with the runner's
      # Android SDK.
      - name: Android host tests
        run: ./gradlew --no-daemon testAndroidHostTest
      - name: Uncovered lines and branches
        if: always()
        run: python3 .github/scripts/kover_missed.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: '**/build/reports/**'
          retention-days: 7
      # tools/docs-truth checks the docs of every repository against what main ships (the server's generated OpenAPI
      # document, the binary's help, the sources' OSTROM_ variables); the repositories run it from a pinned commit. Node
      # is the one set up for the OpenAPI document above.
      - name: docs-truth's tests, 100 % lines, branches and functions
        working-directory: tools/docs-truth
        run: npm test
  other-hosts:
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            task: macosArm64Test
          - runner: windows-latest
            task: mingwX64Test
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - run: ./gradlew --no-daemon ${{ matrix.task }}
        shell: bash
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci]
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      # The Kotlin/Native toolchain and its dependencies (~1 GB) are not in the Gradle cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-2.4.21-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-2.4.21-
      - name: Publish run.ostrom:ostrom-* 0.1.<run> to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_ostromCoreVersion: 0.1.${{ github.run_number }}
        run: ./gradlew --no-daemon publishAllPublicationsToGitHubPackagesRepository
      - run: echo "Published run.ostrom:ostrom-api, ostrom-client, ostrom-receipts, ostrom-telemetry and ostrom-actions 0.1.${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
